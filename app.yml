# yaml-language-server: $schema=./pennsieve-app-schema.json
schemaVersion: 1.0.0
application:
  id: pytorch-example
  name: pytorch-example
  description: pytorch-example
  version: 1.0.1
  type: processor
  maintainers:
    - name: edmore
  tags:
    - demo
runtime:
  cpu: 1024
  memory: 2048
  computeTypes:
    - standard
  timeoutSeconds: 300
parameters:
  - name: threshold
    type: number
    description: Detection threshold.
    defaultValue: "0.5"
    validValues:
      - "0.1"
      - "0.5"
      - "0.9"
  - name: mode
    type: string
    description: Processing mode.
    defaultValue: fast
    validValues:
      - fast
      - accurate
  - name: verbose
    type: boolean
    description: Enable verbose logging.
    defaultValue: "false"
  - name: channel
    type: string
    description: Channel to analyze (no default, treated as required).
commandArguments: []
inputs:
  - name: package_file
    description: Pipeline package file.
    mediaTypes:
      - application/octet-stream
    cardinality: one
    required: true
outputs:
  - name: package_file
    description: Pipeline package file.
    mediaTypes:
      - application/octet-stream
